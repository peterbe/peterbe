name: Test README blog posts

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Update README
        run: npm run update-readme

      - name: Lint code
        run: npm run lint

      - name: Diff?
        run: git diff
