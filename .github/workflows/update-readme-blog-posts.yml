name: Update README blog posts

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Update README
        run: bun run update-readme

      - name: Diff?
        run: git diff

      - name: Commit
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git status | grep 'nothing to commit' && exit 0

          git config --global user.name "peterbe"
          git config --global user.email "peterbe@users.noreply.github.com"

          date=$(date '+%Y-%m-%d-%H-%M')
          git checkout main
          git add README.md
          git commit -m "update blog posts in readme ($date)"
          git push origin main
